name: release

on:
  push:
    tags:
      - "*.*.*"
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: build-windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install 26100 SDK and WDK
        run: |
          winget install --source winget --exact --id Microsoft.WindowsSDK.10.0.26100 --disable-interactivity --accept-source-agreements
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --disable-interactivity --accept-source-agreements
          echo "WindowsTargetPlatformVersion=10.0.26100.0" >> $Env:GITHUB_ENV

      - name: Figure out if we're running for a tag
        id: checktag
        run: |
          cd ${{ github.workspace }}
          If($Env:GITHUB_REF -match "([0-9]+)\.([0-9]+)\.([0-9]+)") {
              $IsRelease = "yes";
              $Version = $Matches[0];
              $VersionMajor = $Matches[1];
              $VersionMinor = $Matches[2];
              $VersionPatch = $Matches[3];
          } Else {
              $IsRelease = "no";
              $Version = (git describe --dirty --broken --always);
              If($Version -match "([0-9]*)\.([0-9]*)\.([0-9]*)-.*") {
                  $VersionMajor = $Matches[1];
                  $VersionMinor = $Matches[2];
                  $VersionPatch = $Matches[3];
              } Else {
                  $VersionMajor = 0;
                  $VersionMinor = 0;
                  $VersionPatch = 0;
              }
          }
          Echo ("is_release=" + $IsRelease) >> $Env:GITHUB_OUTPUT;
          Echo ("version=" + $Version) >> $Env:GITHUB_OUTPUT;
          Echo ("version_major=" + $VersionMajor) >> $Env:GITHUB_OUTPUT;
          Echo ("version_minor=" + $VersionMinor) >> $Env:GITHUB_OUTPUT;
          Echo ("version_patch=" + $VersionPatch) >> $Env:GITHUB_OUTPUT;

      - name: Build all
        env:
          CI_VERSION: ${{ steps.checktag.outputs.version }}
          CI_VERSION_MAJOR: ${{ steps.checktag.outputs.version_major }}
          CI_VERSION_MINOR: ${{ steps.checktag.outputs.version_minor }}
          CI_VERSION_PATCH: ${{ steps.checktag.outputs.version_patch }}
        run: |
          cd ${{ github.workspace }}
          .\build_all.ps1 *>&1 | Tee-Object -FilePath build.log
          $Code = $LASTEXITCODE
          If ($Code -ne 0) {
            # Surface the first errors as annotations, so they show up in the run summary
            Select-String -Path build.log -Pattern 'error[: ]|FAILED:|CMake Error' |
              Select-Object -First 10 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $Code
          }

      - name: Run hash tests
        run: |
          cd ${{ github.workspace }}
          $Env:Path = "$((Get-Item .\install\algorithms).FullName);$Env:Path"
          New-Item -Path "install\hash-tests" -ItemType Directory -Force | Out-Null
          $Golden = ".\OpenHashTab\HashTests\golden.txt"
          $Failed = $false
          "x64", "x86" | ForEach-Object {
            $Exe = ".\build\oht-$_\HashTests.exe"
            If (-not (Test-Path $Exe)) { Write-Host "::error::$Exe was not built"; $Failed = $true; return }
            Write-Host "=== HashTests $_ (generate)"
            & $Exe --generate ".\install\hash-tests\golden-$_.txt"
            If ($LASTEXITCODE -ne 0) { $Failed = $true }
            If (Test-Path $Golden) {
              Write-Host "=== HashTests $_ (verify)"
              & $Exe $Golden
              If ($LASTEXITCODE -ne 0) { $Failed = $true }
            }
          }
          If (-not (Test-Path $Golden)) {
            Write-Host "::warning::No golden file committed yet, only cross-flavor and known vector checks were run"
            Get-Content ".\install\hash-tests\golden-x64.txt"
          }
          If ($Failed) { exit 1 }

      - name: Upload hash test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hash-tests
          path: |
            .\install\hash-tests\*.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: |
            .\install\*.msi

      - name: Upload unpacked
        uses: actions/upload-artifact@v7
        with:
          name: unpacked
          path: |
            .\build\oht-*\*.dll
            .\build\oht-*\*.exe
            .\build\oht-*\*.pdb
